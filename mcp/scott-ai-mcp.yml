    coding agent (alongside a Scott skill and rule). It lets the agent sync
    local history, push a thread into a planspace, and pull reviewed context.
    Exact tool identifiers are not published; the capabilities below mirror the
    documented agent-facing verbs and back onto the REST agent-loop operations.
