openapi: 3.1.0
info:
  title: One-Shot access waitlist API
  version: 1.0.0
tags:
- name: waitlist
paths:
  /waitlist:
    post:
      tags:
      - waitlist
      summary: Join Waitlist
      description: 'Add an email to the waitlist. Intentionally unauthenticated.


        Idempotent: duplicate email returns the existing entry.'
      operationId: join_waitlist
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WaitlistCreate'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaitlistResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    WaitlistCreate:
      properties:
        email:
          type: string
          maxLength: 254
          title: Email
        name:
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
          title: Name
        company:
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
          title: Company
        origin:
          type: string
          maxLength: 200
          title: Origin
        e_team_size:
          anyOf:
          - type: string
            maxLength: 50
          - type: 'null'
          title: E Team Size
        e_role:
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
          title: E Role
        e_message:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
          title: E Message
      type: object
      required:
      - email
      - origin
      title: WaitlistCreate
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    WaitlistResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        email:
          type: string
          title: Email
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        company:
          anyOf:
          - type: string
          - type: 'null'
          title: Company
        origin:
          type: string
          title: Origin
        e_team_size:
          anyOf:
          - type: string
          - type: 'null'
          title: E Team Size
        e_role:
          anyOf:
          - type: string
          - type: 'null'
          title: E Role
        e_message:
          anyOf:
          - type: string
          - type: 'null'
          title: E Message
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - id
      - email
      - name
      - company
      - origin
      - e_team_size
      - e_role
      - e_message
      - created_at
      title: WaitlistResponse
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
