openapi: 3.2.0
info:
  title: One-Shot Orgs API
  version: 1.0.0
tags:
- name: Orgs
paths:
  /orgs/{org_id}:
    patch:
      tags:
      - Orgs
      summary: Update Org External Sharing
      description: 'Owners-only toggle of org-wide external sharing.


        - Non-owners (or non-members) get 403.

        - Missing org → 404.

        - Idempotent: when the value already matches the existing row, no audit-log row is written

        and the existing row is returned unchanged.'
      operationId: update_org_external_sharing
      security:
      - HTTPBearer: []
      parameters:
      - name: org_id
        in: path
        required: true
        schema:
          type: string
          title: Org Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrgExternalSharingRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    OrgResponse:
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
        claimed_domain:
          anyOf:
          - type: string
          - type: 'null'
          title: Claimed Domain
        external_sharing_enabled:
          type: boolean
          title: External Sharing Enabled
      type: object
      required:
      - id
      - name
      - external_sharing_enabled
      title: OrgResponse
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    UpdateOrgExternalSharingRequest:
      properties:
        external_sharing_enabled:
          type: boolean
          title: External Sharing Enabled
      additionalProperties: false
      type: object
      required:
      - external_sharing_enabled
      title: UpdateOrgExternalSharingRequest
      description: 'Typed body for the PATCH endpoint — refuses unknown fields so callers fail loudly when the

        schema drifts rather than silently no-opping on a misspelled key.'
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
