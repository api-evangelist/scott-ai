openapi: 3.1.0
info:
  title: One-Shot access cli-version API
  version: 1.0.0
tags:
- name: cli-version
paths:
  /cli-version:
    get:
      tags:
      - cli-version
      summary: Get Cli Version Info
      operationId: get_cli_version_info
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CliVersionInfo'
components:
  schemas:
    CliVersionInfo:
      properties:
        latest:
          type: string
          title: Latest
        minimum:
          type: string
          title: Minimum
      type: object
      required:
      - latest
      - minimum
      title: CliVersionInfo
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
