openapi: 3.1.0
info:
  title: One-Shot access e2b API
  version: 1.0.0
tags:
- name: e2b
paths:
  /e2b/stop-sandbox/{sandbox_id}:
    delete:
      tags:
      - e2b
      summary: Stop Sandbox
      operationId: stop_sandbox_e2b_stop_sandbox__sandbox_id__delete
      parameters:
      - name: sandbox_id
        in: path
        required: true
        schema:
          type: string
          title: Sandbox Id
      - name: include_events
        in: query
        required: false
        schema:
          type: boolean
          description: Fetch sandbox events from E2B API
          default: false
          title: Include Events
        description: Fetch sandbox events from E2B API
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /e2b/agent-service-health:
    get:
      tags:
      - e2b
      summary: Health Check Sandbox
      operationId: health_check_sandbox_e2b_agent_service_health_get
      parameters:
      - name: sandbox_url
        in: query
        required: true
        schema:
          type: string
          description: Base URL of sandbox
          title: Sandbox Url
        description: Base URL of sandbox
      - name: timeout
        in: query
        required: false
        schema:
          type: number
          maximum: 30.0
          minimum: 0.1
          description: Request timeout in seconds
          default: 3.0
          title: Timeout
        description: Request timeout in seconds
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: boolean
                title: Response Health Check Sandbox E2B Agent Service Health Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
