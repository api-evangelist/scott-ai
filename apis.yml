aid: scott-ai
name: Scott Ai
description: >-
  Scott (by Juno Labs Inc.) is a Y Combinator (F25) planning workspace for
  engineering teams that build with coding agents. Teams sync recent local agent
  sessions, push a coding-agent thread into a shareable "planspace", align on
  design intent through Sync Chat, comments, reviews and approvals, then pull the
  reviewed context back into execution. Scott ships a first-party CLI/plugin
  (curl-installed) that wires a Scott skill, rule, and hosted MCP server into
  Claude Code, Cursor, Codex, OpenCode and Gemini, plus a GitHub App that reviews
  pull requests against planspace design intent. This profile enriches the
  provider from its public REST API (api.tryscott.ai, 139 operations), docs, CLI,
  MCP surface, and security posture.
